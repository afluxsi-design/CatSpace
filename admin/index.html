<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatSpace Admin</title><link rel="stylesheet" href="/assets/site.css"></head><body><main class="admin-shell"><a class="text-link" href="/">← Back to site</a><h1>CatSpace Admin</h1><p>Private product catalog workspace — initial technical version.</p><section class="admin-box"><h2>Administrator access</h2><p>Enter the admin token configured as the <code>ADMIN_TOKEN</code> secret in Cloudflare Pages.</p><input id="token" type="password" autocomplete="current-password" placeholder="Admin token"><button id="load">Load catalog</button><p id="message" role="status"></p></section><section class="admin-box"><h2>Product catalog</h2><div id="results">Catalog is locked until authentication.</div></section></main><script>
const tokenInput=document.getElementById('token'), message=document.getElementById('message'), results=document.getElementById('results');
document.getElementById('load').addEventListener('click',async()=>{message.textContent='Loading…';try{const r=await fetch('/api/admin/products',{headers:{'Authorization':'Bearer '+tokenInput.value}});if(!r.ok)throw new Error(r.status===401?'Access denied. Check the token.':'Request failed: '+r.status);const data=await r.json();message.textContent='Catalog loaded.';if(!data.products?.length){results.textContent='No products registered yet.';return;}const table=document.createElement('table');table.className='admin-table';table.innerHTML='<thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Status</th><th>Verification</th></tr></thead>';const tbody=document.createElement('tbody');for(const p of data.products){const tr=document.createElement('tr');for(const value of [p.product_id,p.name,p.category_name,p.status,p.verification_status]){const td=document.createElement('td');td.textContent=value??'—';tr.appendChild(td);}tbody.appendChild(tr);}table.appendChild(tbody);results.replaceChildren(table);}catch(e){message.textContent=e.message;}});
</script></body></html>
